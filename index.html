<script>

async function persistAccounts(){throw Error('Use as funções de administração específicas.')}
/* ===== REGRAS DE NEGÓCIO ===== */
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}),NUM=new Intl.NumberFormat('pt-BR');
const money=v=>BRL.format(v),pctf=v=>(v>0?'+':'')+v.toFixed(2).replace('.',',')+'%';
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>new Date(s+'T12:00:00'),br=s=>s.split('-').reverse().join('/');
const days=(a,b)=>{const r=[];for(let d=pd(a);iso(d)<=b;d.setDate(d.getDate()+1))r.push(iso(d));return r};
const growth=(c,p)=>p==null||p===0?null:(c-p)/p*100;

function agg(rng,ids){const m=new Map();SAL.forEach(s=>{if(s.data>=rng[0]&&s.data<=rng[1]&&ids.includes(s.acc))m.set(s.id,s)});let r=0,u=0,n=0;m.forEach(s=>{r+=s.fat;u+=s.un;n++});return{r,u,n,t:ticket(r,u)}}
function series(rng,ids){return days(rng[0],rng[1]).map(d=>{const l=SAL.filter(s=>s.data==d&&ids.includes(s.acc));return l.length?{r:l.reduce((a,s)=>a+s.fat,0),u:l.reduce((a,s)=>a+s.un,0)}:null})}
/* filtros */
const D0=new Date(),fd=(y,m,d)=>iso(new Date(y,m,d));
const defF=()=>({mode:'30',lvl:'geral',plat:'M',acc:'a0',cs:iso(new Date(Date.now()-29*864e5)),ce:today});
let F=defF(),A={...F};
function periods(f){const n={'30':30,'15':15,'7':7}[f.mode];let a,b=today;if(n)a=iso(new Date(Date.now()-(n-1)*864e5));else{a=f.cs;b=f.ce}const sh=s=>{const d=pd(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()-1);const l=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,l));return iso(d)};return{c:[a,b],p:[sh(a),sh(b)]}}
function periodsOld(f){const y=D0.getFullYear(),m=D0.getMonth();const mr=(s,full)=>{const[yy,mm]=s.split('-').map(Number);const a=fd(yy,mm-1,1),l=fd(yy,mm,0);return[a,full||l<=today?l:today]};
if(f.mode=='mtd'){const pl=fd(y,m,0);const pe=fd(y,m-1,Math.min(D0.getDate(),+pl.slice(8)));return{c:[fd(y,m,1),today],p:[fd(y,m-1,1),pe]}}

if(f.mode=='spec')return{c:mr(f.mA,true),p:mr(f.mB,true)};

const P=()=>periods(A);
const ids=()=>ACC.filter(a=>A.lvl=='geral'||(A.lvl=='plat'&&a.plat==A.plat)||(A.lvl=='conta'&&a.id==A.acc)).map(a=>a.id);

function rows(ii){const p=P();return ii.map(id=>{const a=aby(id),c=agg(p.c,[id]),q=agg(p.p,[id]);return{a,c,q,g:q.n?growth(c.r,q.r):null,dv:c.r-q.r}})}

const NAV=[['dash','Dashboard Geral','M3 12l9-9 9 9M5 10v10h14V10'],['plat','Análise por Plataforma','M4 4h16v6H4zM4 14h16v6H4z'],['conta','Análise por Conta','M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0'],['comp','Comparativo de Períodos','M7 4v16M17 4v16M3 8l4-4 4 4M13 16l4 4 4-4'],['evo','Evolução de Vendas','M3 17l6-6 4 4 8-8'],['lanc','Lançamento de Vendas','M12 5v14M5 12h14'],['hist','Histórico de Lançamentos','M12 8v4l3 2M21 12a9 9 0 11-18 0 9 9 0 0118 0'],['cfg','Configurações','M12 15a3 3 0 100-6 3 3 0 000 6zM19 12h2M3 12h2M12 3v2M12 19v2']];
let page='dash',CH=[],edit=null,hq='',hs={k:'data',d:-1},hf={a:'',b:'',p:'',c:''},imp=null;

function chart(id,type,labels,ds,o={}){const e=document.getElementById(id);if(!e||!window.Chart)return;CH.push(new Chart(e,{type,data:{labels,datasets:ds},options:{responsive:true,maintainAspectRatio:false,spanGaps:false,plugins:{legend:{position:'bottom'}},...o}}))}
const BL=['#1d4ed8','#93c5fd'],PAL=['#0b1f3f','#1d4ed8','#3b82f6','#60a5fa','#93c5fd','#bfdbfe','#1e3a8a','#2563eb','#7dd3fc'];
const bar=(id,l,c,q)=>chart(id,'bar',l,[{label:'Mês passado',data:q,backgroundColor:BL[1],borderRadius:4},{label:'Mês atual',data:c,backgroundColor:BL[0],borderRadius:4}]);
function filterBar(){const f=F,lv=page=='conta'?'conta':f.lvl,so=(v,t,c)=>`<option value="${v}" ${c==v?'selected':''}>${t}</option>`;
return`<div class="card nopr" style="margin-bottom:14px"><div class="f">${page=='conta'?'':`<label>Comparação (mês passado x mês atual)<select onchange="F.lvl=this.value;go(page)">${so('geral','Faturamento geral — todas as contas',lv)}${so('plat','Plataforma',lv)}${so('conta','Conta',lv)}</select></label>`}${lv=='plat'?`<label>Plataforma<select onchange="F.plat=this.value">${so('M','Mercado Livre',f.plat)}${so('S','Shopee',f.plat)}</select></label>`:''}${lv=='conta'?`<label>Conta<select onchange="F.acc=this.value">${ACC.map(a=>so(a.id,aname(a),f.acc)).join('')}</select></label>`:''}<label>Período<select onchange="F.mode=this.value;go(page)">${so('custom','Data personalizada',f.mode)}${so('30','Últimos 30 dias',f.mode)}${so('15','Últimos 15 dias',f.mode)}${so('7','Últimos 07 dias',f.mode)}</select></label>${f.mode=='custom'?`<label>De<input type="date" value="${f.cs}" onchange="F.cs=this.value"></label><label>Até<input type="date" value="${f.ce}" onchange="F.ce=this.value"></label>`:''}<button class="p" onclick="A={...F};go(page)">Aplicar filtros</button><button onclick="F=defF();A={...F};go(page)">Limpar filtros</button></div></div>`}
function filterBarOld(){const f=F,o=(v,t)=>`<option value="${v}" ${f.mode==v?'selected':''}>${t}</option>`;
return`<div class="card nopr" style="margin-bottom:14px"><div class="f"><label>Comparação<select onchange="F.mode=this.value;go(page)">${o('mtd','Acumulado do mês x mesmos dias do mês anterior')}${o('full','Mês completo x mês completo')}${o('spec','Mês específico x outro mês')}${o('custom','Período personalizado')}</select></label>
${f.mode=='spec'?`<label>Mês atual<input type="month" value="${f.mA}" onchange="F.mA=this.value"></label><label>Mês base<input type="month" value="${f.mB}" onchange="F.mB=this.value"></label>`:''}
${f.mode=='custom'?['cs','ce','ps','pe'].map((k,i)=>`<label>${['Atual de','Atual até','Anterior de','Anterior até'][i]}<input type="date" value="${f[k]}" onchange="F.${k}=this.value"></label>`).join(''):''}
<label>Plataforma<select onchange="F.plat=this.value">${[['','Todas'],['M','Mercado Livre'],['S','Shopee']].map(x=>`<option value="${x[0]}" ${f.plat==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label>
<label>Contas (múltipla)<select multiple size="3" onchange="F.sel=[...this.selectedOptions].map(x=>x.value)">${ACC.map(a=>`<option value="${a.id}" ${f.sel.includes(a.id)?'selected':''}>${aname(a)}</option>`).join('')}</select></label>
<button class="p" onclick="A={...F,sel:[...F.sel]};go(page)">Aplicar filtros</button><button onclick="F=defF();A={...F};go(page)">Limpar filtros</button></div></div>`}
function pinfo(){const p=P(),n=r=>days(r[0],r[1]).length;return`<div class="${n(p.c)!=n(p.p)?'w':'p'}" style="${n(p.c)!=n(p.p)?'':'color:#64748b;margin-bottom:10px;font-size:13px'}">Mês atual: ${br(p.c[0])} a ${br(p.c[1])} (${n(p.c)} dias) · Mês passado: ${br(p.p[0])} a ${br(p.p[1])} (${n(p.p)} dias)${n(p.c)!=n(p.p)?' — atenção: os períodos têm durações diferentes.':''}</div>`}

return`<div class="g g3">${k('Faturamento',c.r,hb?q.r:null,hb?growth(c.r,q.r):null,money)}${k('Unidades vendidas',c.u,hb?q.u:null,hb?growth(c.u,q.u):null,NUM.format)}${k('Ticket médio (por unidade)',c.t,q.t,c.t!=null&&q.t!=null?growth(c.t,q.t):null,money)}</div>`}

function dash(){const ii=ids(),p=P(),c=agg(p.c,ii),q=agg(p.p,ii),rs=rows(ii);if(noData(ii))return filterBar()+'<div class="card em">Nenhum lançamento no período selecionado.</div>';
const pl=['M','S'].map(x=>({c:agg(p.c,ii.filter(i=>aby(i).plat==x)).r,q:agg(p.p,ii.filter(i=>aby(i).plat==x)).r}));
window.after=()=>{bar('c1',['Faturamento total'],[c.r],[q.r]);bar('c2',['Mercado Livre','Shopee'],pl.map(x=>x.c),pl.map(x=>x.q));bar('c3',rs.map(x=>aname(x.a)),rs.map(x=>x.c.r),rs.map(x=>x.q.r));dailyChart('c4',ii);
chart('c5','doughnut',['Mercado Livre','Shopee'],[{data:pl.map(x=>x.c),backgroundColor:PAL}]);chart('c6','doughnut',rs.map(x=>aname(x.a)),[{data:rs.map(x=>x.c.r),backgroundColor:PAL}])};
const cv=(i,t)=>`<div class="card"><h3>${t}</h3><div class="ch"><canvas id="${i}"></canvas></div></div>`;
return filterBar()+pinfo()+kpis(c,q)+`<div class="g">${cv('c4','Evolução diária do faturamento')}</div><div class="g g2">${cv('c1','Comparativo geral de faturamento')}${cv('c2','Faturamento por plataforma')}${cv('c3','Faturamento por conta')}${cv('c5','Participação por plataforma')}${cv('c6','Participação por conta')}</div>`+rtable(rs,true)}
function plat(){const p=P(),ii=ids(),ps=['M','S'].filter(x=>A.lvl=='geral'||(A.lvl=='plat'?A.plat==x:aby(A.acc).plat==x)),tot=agg(p.c,ii).r;
window.after=()=>{bar('pc',ps.map(x=>PL[x]),ps.map(x=>agg(p.c,ii.filter(i=>aby(i).plat==x)).r),ps.map(x=>agg(p.p,ii.filter(i=>aby(i).plat==x)).r));ps.forEach(x=>dailyChart('pd'+x,ii.filter(i=>aby(i).plat==x)))};
return filterBar()+pinfo()+ps.map(x=>{const pi=ii.filter(i=>aby(i).plat==x),c=agg(p.c,pi),q=agg(p.p,pi);return`<h3 style="margin-top:18px">${PL[x]} · participação ${tot?pctf(c.r/tot*100).replace('+',''):'—'}</h3>${kpis(c,q)}<div class="card" style="margin-bottom:14px"><div class="ch"><canvas id="pd${x}"></canvas></div></div>`+rtable(rows(pi),false)}).join('')+`<div class="card" style="margin-top:14px"><h3>Comparativo entre plataformas</h3><div class="ch"><canvas id="pc"></canvas></div></div>`}
function conta(){const ii=ACC.map(a=>a.id),id=ACC.some(a=>a.id==A.acc)?A.acc:ii[0];const p=P(),c=agg(p.c,[id]),q=agg(p.p,[id]),a=aby(id),pi=ACC.filter(x=>x.plat==a.plat).map(x=>x.id),tp=agg(p.c,pi).r,tg=agg(p.c,ACC.map(x=>x.id)).r;
window.after=()=>{bar('a1',['Faturamento'],[c.r],[q.r]);bar('a2',['Unidades'],[c.u],[q.u]);dailyChart('a3',[id]);dailyChart2('a4',id);const ms=[];for(let i=5;i>=0;i--){const m=new Date(D0.getFullYear(),D0.getMonth()-i,1);ms.push([m.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}),agg([fd(m.getFullYear(),m.getMonth(),1),fd(m.getFullYear(),m.getMonth()+1,0)],[id]).r])}chart('a5','bar',ms.map(x=>x[0]),[{label:'Faturamento mensal',data:ms.map(x=>x[1]),backgroundColor:BL[0],borderRadius:4}])};
const g=q.n?growth(c.r,q.r):null,cv=(i,t)=>`<div class="card"><h3>${t}</h3><div class="ch"><canvas id="${i}"></canvas></div></div>`;
return filterBar()+pinfo()+`<div class="card" style="margin-bottom:14px"><label>Conta <select onchange="F.acc=A.acc=this.value;render()">${ii.map(i=>`<option value="${i}" ${i==id?'selected':''}>${aname(aby(i))}</option>`).join('')}</select></label> &nbsp; Tendência: ${g==null?bdg(null):g>0?'<span class="b up">Crescendo</span>':g<0?'<span class="b dn">Perdendo desempenho</span>':'<span class="b">Estável</span>'}</div>`+kpis(c,q)+`<div class="g g3"><div class="card k"><div class="l">Diferença em R$</div><div class="v">${q.n?money(c.r-q.r):'—'}</div></div><div class="card k"><div class="l">Part. na plataforma</div><div class="v">${tp?pctf(c.r/tp*100).replace('+',''):'—'}</div></div><div class="card k"><div class="l">Part. no geral</div><div class="v">${tg?pctf(c.r/tg*100).replace('+',''):'—'}</div></div></div><div class="g">${cv('a3','Evolução diária do faturamento')}</div><div class="g g2">${cv('a1','Faturamento entre períodos')}${cv('a2','Unidades entre períodos')}${cv('a4','Unidades diárias')}${cv('a5','Histórico mensal')}</div>`}
function dailyChart2(id,acc){dailyChart(id,[acc],'u')}
function comp(){const ii=ids(),p=P(),c=agg(p.c,ii),q=agg(p.p,ii);return filterBar()+pinfo()+kpis(c,q)+`<div class="g"><div class="card"><h3>Evolução diária do faturamento</h3><div class="ch"><canvas id="m1"></canvas></div></div></div><div class="g"><div class="card"><h3>Faturamento por conta</h3><div class="ch"><canvas id="m2"></canvas></div></div></div>`+rtable(rows(ii),true)+(window.after=()=>{dailyChart('m1',ii);const rs=rows(ii);bar('m2',rs.map(x=>aname(x.a)),rs.map(x=>x.c.r),rs.map(x=>x.q.r))},'')}
function evo(){const ii=ids(),g=window.eg||'d',m=window.em||'r',p=P();const val=s=>s?(m=='r'?s.r:m=='u'?s.u:ticket(s.r,s.u)):null;
window.after=()=>{if(g=='m'){const ms=[...new Set(SAL.filter(s=>ii.includes(s.acc)).map(s=>s.data.slice(0,7)))].sort();chart('e1','bar',ms,[{label:'Mensal',data:ms.map(k=>{const v=agg([k+'-01',k+'-31'],ii);return m=='r'?v.r:m=='u'?v.u:v.t}),backgroundColor:BL[0],borderRadius:4}]);return}
const ch=a=>{if(g=='d')return a.map(val);const o=[];for(let i=0;i<a.length;i+=7){const w=a.slice(i,i+7).filter(Boolean),r=w.reduce((x,s)=>x+s.r,0),u=w.reduce((x,s)=>x+s.u,0);o.push(w.length?(m=='r'?r:m=='u'?u:ticket(r,u)):null)}return o},a=ch(series(p.c,ii)),b=ch(series(p.p,ii)),mx=Math.max(...a.filter(v=>v!=null)),mn=Math.min(...a.filter(v=>v!=null)),L=Math.max(a.length,b.length);
chart('e1','bar',Array.from({length:L},(_,i)=>(g=='d'?'Dia ':'Sem ')+(i+1)),[{label:'Mês passado',type:'bar',backgroundColor:BL[1],borderRadius:3,order:2,data:b},{label:'Mês atual',type:'line',order:1,data:a,borderColor:BL[0],tension:.3,pointRadius:a.map(v=>v===mx||v===mn?7:2),pointBackgroundColor:a.map(v=>v===mx?'#16a34a':v===mn?'#dc2626':BL[0])}])};
return filterBar()+pinfo()+`<div class="card"><div class="f"><label>Granularidade<select onchange="eg=this.value;render()"><option value="d" ${g=='d'?'selected':''}>Diária</option><option value="s" ${g=='s'?'selected':''}>Semanal</option><option value="m" ${g=='m'?'selected':''}>Mensal</option></select></label><label>Métrica<select onchange="em=this.value;render()"><option value="r" ${m=='r'?'selected':''}>Faturamento</option><option value="u" ${m=='u'?'selected':''}>Unidades</option><option value="t" ${m=='t'?'selected':''}>Ticket médio</option></select></label></div><p style="color:#64748b;font-size:12px">Verde = maior valor · Vermelho = menor valor. Dias sem lançamento aparecem como lacuna, não como zero.</p><div class="ch" style="height:340px"><canvas id="e1"></canvas></div></div>`}
/* lançamentos */
const actAcc=pl=>ACC.filter(a=>a.ativa&&(!pl||a.plat==pl));
function upsert(d,acc,fat,un){const i=SAL.findIndex(s=>s.data==d&&s.acc==acc);const r={id:acc+d,data:d,acc,fat,un};i>=0?SAL[i]=r:SAL.push(r)}
function lanc(){if(!canEdit())return '<div class="card em">Acesso somente para leitura.</div>';const e=edit?SAL.find(s=>s.id==edit):null,pl=e?aby(e.acc).plat:window.lp||'S';
window.after=()=>{};return`<div class="card" style="margin-bottom:14px"><h3>${e?'Editar lançamento':'Novo lançamento'}</h3><div class="f"><label>Data<input type="date" id="fd" value="${e?e.data:today}" max="${today}"></label><label>Plataforma<select id="fp" onchange="lp=this.value;edit=null;render()"><option value="S" ${pl=='S'?'selected':''}>Shopee</option><option value="M" ${pl=='M'?'selected':''}>Mercado Livre</option></select></label><label>Conta<select id="fc">${actAcc(pl).map(a=>`<option value="${a.id}" ${e&&e.acc==a.id?'selected':''}>${aname(a)}</option>`).join('')}</select></label><label>Faturamento (R$)<input type="number" step="0.01" min="0" id="ff" value="${e?e.fat:''}"></label><label>Unidades<input type="number" step="1" min="0" id="fu" value="${e?e.un:''}"></label><button class="p" onclick="saveOne()">Salvar lançamento</button>${e?'<button onclick="edit=null;render()">Cancelar</button>':''}</div></div>
<div class="card"><h3>Lançamento em lote</h3><div class="f" style="margin-bottom:10px"><label>Data<input type="date" id="bd" value="${today}" max="${today}" onchange="fillBatch()"></label><button class="p" onclick="saveBatch()">Salvar todos os lançamentos</button></div><div class="tw"><table><tr><th>Conta</th><th>Faturamento</th><th>Unidades</th></tr>${actAcc().map(a=>`<tr><td>${aname(a)}</td><td><input type="number" min="0" step="0.01" data-b="f${a.id}" placeholder="R$"></td><td><input type="number" min="0" step="1" data-b="u${a.id}"></td></tr>`).join('')}</table></div><p style="color:#64748b;font-size:12px">Campos vazios = sem lançamento (não é zero). Digite 0 para registrar zero. Data + conta existente é atualizada, nunca duplicada.</p></div>`+(window.after=fillBatch,'')}
function fillBatch(){const d=$('#bd').value;actAcc().forEach(a=>{const s=SAL.find(x=>x.data==d&&x.acc==a.id);document.querySelector(`[data-b="f${a.id}"]`).value=s?s.fat:'';document.querySelector(`[data-b="u${a.id}"]`).value=s?s.un:''})}
const bad=(f,u)=>isNaN(f)||isNaN(u)||f<0||u<0||!Number.isInteger(u);
async function saveOne(){if(!canEdit())return;const d=$('#fd').value,c=$('#fc').value,f=parseFloat($('#ff').value),u=parseFloat($('#fu').value);if(!d||!c||$('#ff').value===''||$('#fu').value==='')return toast('Preencha todos os campos.',1);if(bad(f,u))return toast('Valores inválidos.',1);try{if(edit){const old=SAL.find(x=>x.id===edit);if(old&&(old.data!==d||old.acc!==c)){const {error}=await db.from('vendas').delete().eq('id',old.dbid);if(error)throw error}}await persistSale(d,c,f,u);await refreshData();edit=null;toast('Lançamento salvo.');render()}catch(e){toast('Erro ao salvar: '+e.message,1)}}
async function saveBatch(){if(!canEdit())return;const d=$('#bd').value;if(!d)return toast('Selecione a data.',1);const items=[];for(const a of actAcc()){const f=document.querySelector(`[data-b="f${a.id}"]`).value,u=document.querySelector(`[data-b="u${a.id}"]`).value;if(f===''&&u==='')continue;if(f===''||u===''||bad(+f,+u))return toast('Dados inválidos em '+aname(a),1);items.push({conta_id:a.id,data:d,faturamento:+f,unidades:+u})}if(!items.length)return toast('Nenhum lançamento preenchido.',1);try{const {error}=await db.from('vendas').upsert(items,{onConflict:'conta_id,data'});if(error)throw error;await refreshData();toast(items.length+' lançamento(s) salvos.')}catch(e){toast('Erro: '+e.message,1)}}
function hrows(){return SAL.filter(s=>(!hf.a||s.data>=hf.a)&&(!hf.b||s.data<=hf.b)&&(!hf.p||aby(s.acc).plat==hf.p)&&(!hf.c||s.acc==hf.c)&&(!hq||aname(aby(s.acc)).toLowerCase().includes(hq.toLowerCase()))).sort((a,b)=>{const g=x=>hs.k=='data'?x.data:hs.k=='fat'?x.fat:hs.k=='un'?x.un:aname(aby(x.acc));return(g(a)>g(b)?1:-1)*hs.d})}
const srt=k=>`onclick="hs={k:'${k}',d:hs.k=='${k}'?-hs.d:-1};render()"`;
function hist(){const r=hrows().slice(0,300),tf=hrows().reduce((a,s)=>a+s.fat,0),f=(k,t,ty='date')=>`<label>${t}<input type="${ty}" value="${hf[k]}" onchange="hf.${k}=this.value;render()"></label>`;
return`<div class="card"><div class="f" style="margin-bottom:12px">${f('a','De')}${f('b','Até')}<label>Plataforma<select onchange="hf.p=this.value;render()"><option value="">Todas</option><option value="M" ${hf.p=='M'?'selected':''}>Mercado Livre</option><option value="S" ${hf.p=='S'?'selected':''}>Shopee</option></select></label><label>Conta<select onchange="hf.c=this.value;render()"><option value="">Todas</option>${ACC.map(a=>`<option value="${a.id}" ${hf.c==a.id?'selected':''}>${aname(a)}</option>`).join('')}</select></label><label>Busca<input value="${hq}" onchange="hq=this.value;render()"></label><button onclick="exportCsv()">Exportar CSV (Excel)</button><button onclick="print()">Exportar PDF</button><label>Importar CSV<input type="file" accept=".csv" onchange="importCsv(this)"></label></div>${imp?impBox():''}<p style="color:#64748b">${hrows().length} registros · Total ${money(tf)}</p><div class="tw"><table><tr><th ${srt('data')}>Data</th><th>Plataforma</th><th ${srt('conta')}>Conta</th><th class="n" ${srt('fat')}>Faturamento</th><th class="n" ${srt('un')}>Unidades</th><th class="n">Ticket</th>${canEdit()?'<th class="nopr">Ações</th>':''}</tr>${r.map(s=>{const a=aby(s.acc);return`<tr><td>${br(s.data)}</td><td>${PL[a.plat]}</td><td>${a.nome}</td><td class="n">${money(s.fat)}</td><td class="n">${NUM.format(s.un)}</td><td class="n">${s.un?money(s.fat/s.un):'Não disponível'}</td>${canEdit()?`<td class="nopr"><button onclick="edit='${s.id}';go('lanc')">Editar</button> <button class="d" onclick="del('${s.id}')">Excluir</button></td>`:''}</tr>`}).join('')||'<tr><td colspan=7 class="em">Nenhum registro encontrado.</td></tr>'}</table></div></div>`}
async function del(id){if(!canEdit())return;const s=SAL.find(x=>x.id===id);if(!s||!confirm('Excluir este lançamento?'))return;const {error}=await db.from('vendas').delete().eq('id',s.dbid);if(error)return toast(error.message,1);await refreshData();toast('Lançamento excluído.')}
function exportCsv(){const l=['Data;Plataforma;Conta;Faturamento;Unidades;Ticket'].concat(hrows().map(s=>{const a=aby(s.acc);return[s.data,PL[a.plat],a.nome,s.fat.toFixed(2).replace('.',','),s.un,s.un?(s.fat/s.un).toFixed(2).replace('.',','):''].join(';')}));const u=URL.createObjectURL(new Blob(['\ufeff'+l.join('\n')],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='lancamentos.csv';a.click();toast('CSV gerado.')}
function importCsv(el){const fl=el.files[0];if(!fl)return;fl.text().then(t=>{const ok=[],er=[];t.replace(/^\ufeff/,'').split(/\r?\n/).slice(1).filter(Boolean).forEach((ln,i)=>{const[d,p,c,f,u]=ln.split(';'),acc=ACC.find(a=>PL[a.plat]==p&&a.nome==c),fv=parseFloat((f||'').replace(/\./g,'').replace(',','.')),uv=parseFloat(u);if(!/^\d{4}-\d{2}-\d{2}$/.test(d||'')||!acc||bad(fv,uv))er.push('Linha '+(i+2)+': inválida');else ok.push({d,acc:acc.id,fv,uv})});imp={ok,er};render()})}
function impBox(){return`<div class="w"><b>Prévia da importação:</b> ${imp.ok.length} válidos, ${imp.er.length} com erro. ${imp.er.slice(0,5).join(' · ')}<br><button class="p" onclick="confirmImport()">Confirmar importação</button> <button onclick="imp=null;render()">Cancelar</button><br><small>Formato: data(AAAA-MM-DD);plataforma;conta;faturamento;unidades</small></div>`}
function cfg(){if(!isAdmin())return '<div class="card em">Acesso restrito.</div>';window.after=()=>{};return`<div class="card"><h3>Contas</h3><div class="f" style="margin-bottom:12px"><label>Nome<input id="nn"></label><label>Plataforma<select id="np"><option value="S">Shopee</option><option value="M">Mercado Livre</option></select></label><button class="p" onclick="addAcc()">Adicionar conta</button></div><div class="tw"><table><tr><th>Plataforma</th><th>Nome</th><th>Status</th><th></th></tr>${ACC.map(a=>`<tr><td>${PL[a.plat]}</td><td><input value="${a.nome}" onchange="ren('${a.id}',this.value)"></td><td>${a.ativa?'<span class="b up">Ativa</span>':'<span class="b">Inativa</span>'}</td><td><button onclick="tg('${a.id}')">${a.ativa?'Desativar':'Reativar'}</button></td></tr>`).join('')}</table></div><p style="color:#64748b;font-size:12px">Desativar mantém todo o histórico. Dados compartilhados no Supabase.</p></div>`}
async function confirmImport(){if(!canEdit()||!imp)return;const items=imp.ok.map(x=>({conta_id:x.acc,data:x.d,faturamento:x.fv,unidades:x.uv}));try{if(items.length){const {error}=await db.from('vendas').upsert(items,{onConflict:'conta_id,data'});if(error)throw error}imp=null;await refreshData();toast('Importação concluída.')}catch(e){toast(e.message,1)}}
async function addAcc(){if(!isAdmin())return;const n=$('#nn').value.trim();if(!n)return toast('Informe o nome.',1);const {error}=await db.from('contas').insert({id:'a'+Date.now(),nome:n,plataforma:$('#np').value,ativa:true});if(error)return toast(error.message,1);await refreshData();toast('Conta adicionada.')}
async function ren(id,v){if(!isAdmin())return;if(!v.trim())return toast('Nome inválido.',1);const {error}=await db.from('contas').update({nome:v.trim()}).eq('id',id);if(error)return toast(error.message,1);await refreshData();toast('Nome atualizado.')}
async function tg(id){if(!isAdmin())return;const a=aby(id);const {error}=await db.from('contas').update({ativa:!a.ativa}).eq('id',id);if(error)return toast(error.message,1);await refreshData()}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;document.getElementById('loginError').textContent='';try{const {error}=await db.auth.signInWithPassword({email:document.getElementById('loginEmail').value.trim(),password:document.getElementById('loginPassword').value});if(error)throw error;await enterApp()}catch(err){document.getElementById('loginError').textContent=err.message}finally{button.disabled=false}});
(async()=>{const {data:{session}}=await db.auth.getSession();if(session)await enterApp()})();
</script></body></html>
